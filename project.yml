name: MyQuickFinder
options:
  bundleIdPrefix: com.cuxiao.mac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  MyQuickFinderKit:
    path: MyQuickFinderKit

targets:
  MyQuickFinder:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MyQuickFinderKit
        product: MyQuickFinderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuxiao.mac.myquickfinder
        PRODUCT_NAME: MyQuickFinder
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  MyQuickFinderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MyQuickFinder
      - package: MyQuickFinderKit
        product: MyQuickFinderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuxiao.mac.myquickfinder.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyQuickFinder.app/Contents/MacOS/MyQuickFinder"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MyQuickFinder:
    build:
      targets:
        MyQuickFinder: all
        MyQuickFinderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyQuickFinderTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
