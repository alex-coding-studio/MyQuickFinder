name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, publish
    runs-on: macos-14
    env:
      SCHEME: MyQuickFinder
      APP_NAME: MyQuickFinder.app
      NOTARY_PROFILE: MyQuickFinderCI
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${newest:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install the toolchain
        run: |
          for formula in xcodegen swiftformat swiftlint; do
            brew list --formula "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Check the tag against MARKETING_VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${project_version}." >&2
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Lint and test
        run: |
          ./scripts/lint.sh
          swift test --package-path MyQuickFinderKit
          xcodebuild test \
            -project MyQuickFinder.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"
          sign_id="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$sign_id" ]; then
            echo "No Developer ID Application certificate in the imported keychain." >&2
            exit 1
          fi
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_ID=$sign_id" >> "$GITHUB_ENV"
          echo "TEAM_ID=$(printf '%s' "$sign_id" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')" >> "$GITHUB_ENV"

      - name: Store the notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --keychain "$KEYCHAIN"

      - name: Build with Developer ID
        run: |
          mkdir -p .release-artifacts
          xcodebuild \
            -project MyQuickFinder.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .release-build \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            CODE_SIGN_IDENTITY="$SIGN_ID" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Verify the signature
        run: |
          app=".release-build/Build/Products/Release/$APP_NAME"
          codesign -dvv "$app" 2>&1 | grep -q "Developer ID Application" \
            || { echo "The product is not Developer ID signed." >&2; exit 1; }
          if codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -q "get-task-allow"; then
            echo "The product carries the get-task-allow debug entitlement." >&2
            exit 1
          fi

      - name: Notarize
        run: |
          app=".release-build/Build/Products/Release/$APP_NAME"
          zip=".release-artifacts/MyQuickFinder-${VERSION}.zip"
          ditto -c -k --keepParent "$app" "$zip"
          xcrun notarytool submit "$zip" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN" \
            --wait | tee notary.log
          grep -q "status: Accepted" notary.log || {
            submission="$(awk '/^ *id:/ { print $2; exit }' notary.log)"
            [ -n "$submission" ] && xcrun notarytool log "$submission" \
              --keychain-profile "$NOTARY_PROFILE" --keychain "$KEYCHAIN"
            echo "Notarization was not accepted." >&2
            exit 1
          }

      - name: Staple, verify, and repackage
        run: |
          app=".release-build/Build/Products/Release/$APP_NAME"
          zip=".release-artifacts/MyQuickFinder-${VERSION}.zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t install "$app" 2>&1 | grep -q "accepted" \
            || { echo "Gatekeeper rejects the app." >&2; exit 1; }
          rm -f "$zip"
          ditto -c -k --keepParent "$app" "$zip"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".release-artifacts/MyQuickFinder-${VERSION}.zip" \
            --title "MyQuickFinder ${VERSION}" \
            --notes "Signed with Developer ID, notarized by Apple, ticket stapled. Unzip and drag into Applications."

      - name: Remove the signing keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
